[project]
name = "pulse-platform"
version = "0.1.0"
description = "Навчальний B2B-сервіс замовлень для курсу «Архітектор проєктів з Claude Code»"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/api"
explicit_package_bases = true
ignore_missing_imports = true
